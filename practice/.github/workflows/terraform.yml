name: terraform
on:
  pull_request:
    paths: ["**.tf"]
permissions:
  id-token: write       # OIDC에 필수
  contents: read
  pull-requests: write
jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: 본인 계정의 IAM Role ARN 으로 교체
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/boaz-gha-oidc
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -no-color
